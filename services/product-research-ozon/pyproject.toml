[tool.ruff]
target-version = "py314"

[tool.mypy]
strict = true
mypy_path = "src:typings"
files = ["src", "tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "product_research_ozon"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Чистая логика без HTTP и инфраструктуры"
type = "forbidden"
source_modules = ["product_research_ozon.domain"]
forbidden_modules = ["product_research_ozon.api", "product_research_ozon.infrastructure", "fastapi", "psycopg", "boto3", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Infrastructure не зависит от HTTP и wiring"
type = "forbidden"
source_modules = ["product_research_ozon.infrastructure"]
forbidden_modules = ["product_research_ozon.api", "product_research_ozon.bootstrap", "sqlalchemy"]
