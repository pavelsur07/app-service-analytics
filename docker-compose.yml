services:
  traefik:
    image: traefik:v3.5
    # ponytail: static file provider, not docker-label discovery — routing
    # is fixed (2 hosts, 1 backend) and this skips a docker.sock mount.
    # Switch to the docker provider when routing needs to react to
    # containers appearing/disappearing (Stage 2+).
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./api:/var/www/html:ro
      - ./apps:/var/www/apps:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  php-fpm:
    build:
      context: ./docker/php
      args:
        PHP_VARIANT: fpm
    volumes:
      - ./api:/var/www/html

  php-cli:
    build:
      context: ./docker/php
      args:
        PHP_VARIANT: cli
    user: "1000:1000"
    environment:
      - HOME=/tmp
    volumes:
      - ./api:/var/www/html
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine

  node:
    image: node:22-alpine
    user: "1000:1000"
    environment:
      - HOME=/tmp
    volumes:
      - ./apps:/var/www/apps
    command: ["tail", "-f", "/dev/null"]

  playwright:
    # ponytail: Playwright's browsers need glibc — Alpine (musl) can't run
    # them at all (not a config issue, upstream doesn't support musl).
    # Same node_modules as `node`, only used to run `npx playwright test`.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    user: "1000:1000"
    environment:
      - HOME=/tmp
    volumes:
      - ./apps:/var/www/apps
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
