services:
  traefik:
    image: traefik:v3.5
    # Статический file provider, не обнаружение по docker-меткам:
    # маршрутизация фиксирована (три хоста, один бэкенд), и это избавляет
    # от монтирования docker.sock. Переходить на docker provider — когда
    # маршруты должны будут реагировать на появление контейнеров.
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    # Порты хоста меняются через /.env (не в git), если 80 или 8080 уже
    # заняты, например системным nginx: TRAEFIK_HTTP_PORT=8081 — тогда
    # браузер открывает app.conwix.localhost:8081. Контейнеры ходят друг
    # к другу по *.conwix.internal и от этих портов не зависят.
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./api:/var/www/html:ro
      - ./apps:/var/www/apps:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      # *.internal aliases so other containers (Playwright) reach the
      # real vhosts by name — *.localhost won't do: glibc/most resolvers
      # hardcode that TLD to loopback per RFC 6761, ignoring Docker's DNS.
      default:
        aliases:
          - app.conwix.internal
          - admin.conwix.internal
          - lin.conwix.internal
          # Сервисный контур (ADR-043 п. 4): выдача подключений сервисам.
          - api-internal

  # Оба сервиса собирают одну и ту же стадию dev одного Dockerfile. Разными
  # остаются роли, а не образы: php-fpm обслуживает FastCGI, php-cli —
  # оболочка для инструментов. В production образ один и в другом смысле:
  # там стадия prod, и воркеры Messenger поднимаются из неё же
  # (docker-compose.prod.yml).
  php-fpm:
    build: &php-dev-build
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    # Как и php-cli: под root php-fpm создавал бы в примонтированном api/var
    # файлы, которые потом не перезапишет ни хост, ни php-cli.
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    # Пробрасывается, только если задана на хосте: локально ключ идёт
    # через api/.env.local (в .gitignore), в CI — через секрет раннера
    # (.github/workflows/ci.yml, job e2e). Без значения на хосте
    # docker compose переменную внутрь не кладёт, и Symfony читает
    # .env.local как обычно.
    environment:
      - APP_ENCRYPTION_MASTER_KEY
    volumes:
      - ./api:/var/www/html

  php-cli:
    build: *php-dev-build
    # Хост и контейнер делят bind-mount, поэтому обязаны сходиться в uid.
    # 1000 — разработчик на этой машине; в конвейере раннер ходит под
    # другим uid, и CONTAINER_UID/GID выставляются под него (.github/
    # workflows/ci.yml). Раздать дерево через chown нельзя: часть целей
    # Makefile пишет с хоста, а не из контейнера (api-doc-export,
    # api-types-check — редирект `>` выполняет хостовый shell), и любой
    # выбранный владелец ломал бы вторую половину.
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
      - APP_ENCRYPTION_MASTER_KEY
    volumes:
      - ./api:/var/www/html
      # Контракты сервисов (services/AGENTS.md §3): PHP-тест проверяет свой
      # ответ по их schema.json. Только чтение — источник один, в services/.
      - ./services/_contracts:/var/www/services/_contracts:ro
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Роль и БД сервисов services/ (ADR-043) — на пустом томе; на живом
      # тот же скрипт выполняет make ozon-fetcher-db.
      - ./services/docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine

  # S3-совместимое хранилище сырья для разработки и тестов (ADR-024);
  # на проде — S3 Timeweb Cloud. SeaweedFS, а не MinIO: публичные образы
  # MinIO сняты и с Docker Hub, и с quay.io (проверено 24.09.2026, quay
  # отвечает 401). Проверено на нём то, на что опирается код: создание
  # бакета, адресация по пути, условная запись If-None-Match. Без файла
  # учётных записей SeaweedFS принимает любые ключи — для песочницы
  # этого достаточно, учётка в api/.env только для подписи запросов.
  # volumeSizeLimitMB: каждый том SeaweedFS занимает на диске место
  # по этому лимиту, сколько бы в нём ни лежало. По умолчанию 30000 —
  # около 1 ГБ на том, и десятки томов от тестовых бакетов съели 46 ГБ
  # песочницы при 2,5 МБ данных (25.10.2026). 64 МБ — с большим запасом
  # на самый крупный документ сырья в фикстурах (1,7 МБ). Лимит меняет
  # только новые тома: после правки том s3_data пересоздаётся.
  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-dir=/data", "-master.volumeSizeLimitMB=64"]
    volumes:
      - s3_data:/data

  # glibc (bookworm-slim), не alpine — осознанное расхождение с образами
  # PHP, где база alpine. Нативные модули экосистемы Node (rollup, esbuild,
  # lightningcss, oxc, браузеры Playwright) собираются и тестируются прежде
  # всего под glibc; musl — вторичная цель, и за неё уже заплатили дважды.
  # Здесь тот же libc, что у образа playwright ниже. Подробнее —
  # docs/patterns.md, «База образов».
  node-seller:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
      - VITE_SMARTCAPTCHA_CLIENT_KEY=${SMARTCAPTCHA_CLIENT_KEY:-}
    working_dir: /var/www/apps/seller
    volumes:
      - ./apps:/var/www/apps
      # packages/api-schema — относительные импорты из apps/*/src ведут туда
      # (та же глубина пути, что и на хосте); генерация схемы — тоже отсюда.
      - ./packages:/var/www/packages
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  node-admin:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/admin
    volumes:
      - ./apps:/var/www/apps
      - ./packages:/var/www/packages
    ports:
      - "5174:5174"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]

  # Расширение браузера. Порта нет намеренно: dev-сервера у него быть
  # не может — CSP Manifest V3 запрещает подгрузку кода со стороны,
  # и HMR туда не встроится. Вместо dev-сервера watch-сборка: dist/
  # виден на хосте через тот же bind-mount ./apps, и Chrome грузит
  # его как распакованное расширение (docs/patterns.md, «Расширение
  # браузера»).
  node-extension:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/extension
    volumes:
      - ./apps:/var/www/apps
      - ./packages:/var/www/packages
    command: ["npm", "run", "watch"]

  playwright:
    # Playwright's browsers need glibc — Alpine (musl) can't run them at
    # all (not a config issue, upstream doesn't support musl). Browsers
    # ship pre-installed in this image at the exact revision @playwright/test
    # expects — version below is pinned to match package.json at repo root,
    # the only place @playwright/test is declared. The apps don't pin it:
    # their tests/e2e/* spec files resolve `import ... from
    # '@playwright/test'` upward, to the same root node_modules.
    #
    # Whole repo mounted at /var/www, not just ./apps: playwright.config.ts
    # (one config, two projects — seller and admin, docs/structure.md)
    # lives at repo root and its projects' testDir point into both apps'
    # tests/e2e/, so the container needs to see both from one root.
    #
    # working_dir is repo root, not apps/seller: the root package.json's
    # node_modules is what resolves playwright.config.ts's own `import
    # ... from '@playwright/test'` (Node resolution walks up from the
    # requiring file, not sideways into an app's node_modules) and gives
    # `npx playwright` its CLI. Without a local node_modules on the path
    # (cwd defaulting to `/`), npx falls back to fetching a fresh
    # `playwright` package from the registry, and its test-file discovery
    # walks the filesystem from `/`, hitting /etc/credstore (root-only)
    # and failing with EACCES.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["tail", "-f", "/dev/null"]

  # --- Сервисы вне монолита (services/, ADR-043): профиль services ---
  # Без профиля не поднимаются: make up и конвейер PHP их не трогают.

  # Сам сервис. Загрузка выключена: без SYMFONY_INTERNAL_BASE_URL
  # планировщик и диспетчер не стартуют, наружу сервис не ходит,
  # /health и /ready (БД) отвечают. Включение — этап 5 плана.
  ozon-fetcher:
    build:
      context: services/ozon-fetcher
      dockerfile: docker/Dockerfile
    profiles: ["services"]
    environment:
      LISTEN_ADDR: ":8080"
      # Только песочница: пароль из services/docker/postgres/init.
      DB_DSN: "postgres://svc_ozon_fetcher:ozon_fetcher_dev@postgres:5432/ozon_fetcher?sslmode=disable"
      SENTRY_ENVIRONMENT: dev
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Тулчейн гейтов (make ozon-fetcher-test/-vet/-migrate): debian-образ —
  # go test -race требует cgo. Монтируется весь services/: тесты контракта
  # читают services/_contracts. Не публикуется и не выкладывается.
  ozon-fetcher-dev:
    image: golang:1.27.3
    profiles: ["services"]
    working_dir: /src/ozon-fetcher
    environment:
      CGO_ENABLED: "1"
      DB_DSN: "postgres://svc_ozon_fetcher:ozon_fetcher_dev@postgres:5432/ozon_fetcher?sslmode=disable"
      TEST_DB_DSN: "postgres://svc_ozon_fetcher:ozon_fetcher_dev@postgres:5432/ozon_fetcher_test?sslmode=disable"
      # Интеграционные тесты rawstore и executor: тестовый бакет сырья
      # (тот же, что у PHP, ADR-044), объекты — под префиксом сервиса;
      # тесты создают бакет, если его нет; ключи SeaweedFS не проверяет.
      TEST_S3_ENDPOINT: "http://s3:8333"
      TEST_S3_BUCKET: "conwix-test"
    volumes:
      - ./services:/src
      # Фикстуры Conwix для тестов разбора (internal/ozonfixture): тот же
      # относительный путь от internal/<пакет>, что в репозитории; только чтение.
      - ./api/tests/Fixtures/Marketplace/ozon:/api/tests/Fixtures/Marketplace/ozon:ro
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build
    depends_on:
      - postgres
      - s3

  ozon-fetcher-lint:
    image: golangci/golangci-lint:v2.14.0-alpine
    profiles: ["services"]
    working_dir: /src/ozon-fetcher
    volumes:
      - ./services:/src
      - go_mod:/go/pkg/mod
      - go_build:/root/.cache/go-build

volumes:
  postgres_data:
  s3_data:
  # Кэши Go — с явными именами: одни и те же у compose-проекта песочницы
  # и у конвейера, где проект называется conwix.
  go_mod:
    name: conwix-go-mod
  go_build:
    name: conwix-go-build
