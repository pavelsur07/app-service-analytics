services:
  traefik:
    image: traefik:v3.5
    # Статический file provider, не обнаружение по docker-меткам:
    # маршрутизация фиксирована (два хоста, один бэкенд), и это избавляет
    # от монтирования docker.sock. Переходить на docker provider — когда
    # маршруты должны будут реагировать на появление контейнеров.
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./api:/var/www/html:ro
      - ./apps:/var/www/apps:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      # *.internal aliases so other containers (Playwright) reach the
      # real vhosts by name — *.localhost won't do: glibc/most resolvers
      # hardcode that TLD to loopback per RFC 6761, ignoring Docker's DNS.
      default:
        aliases:
          - app.conwix.internal
          - admin.conwix.internal

  # Оба сервиса собирают одну и ту же стадию dev одного Dockerfile. Разными
  # остаются роли, а не образы: php-fpm обслуживает FastCGI, php-cli —
  # оболочка для инструментов. В production образ один и в другом смысле:
  # там стадия prod, и воркеры Messenger поднимаются из неё же
  # (docker-compose.prod.yml).
  php-fpm:
    build: &php-dev-build
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    # Как и php-cli: под root php-fpm создавал бы в примонтированном api/var
    # файлы, которые потом не перезапишет ни хост, ни php-cli.
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    # Пробрасывается, только если задана на хосте: локально ключ идёт
    # через api/.env.local (в .gitignore), в CI — через секрет раннера
    # (.github/workflows/ci.yml, job e2e). Без значения на хосте
    # docker compose переменную внутрь не кладёт, и Symfony читает
    # .env.local как обычно.
    environment:
      - APP_ENCRYPTION_MASTER_KEY
    volumes:
      - ./api:/var/www/html

  php-cli:
    build: *php-dev-build
    # Хост и контейнер делят bind-mount, поэтому обязаны сходиться в uid.
    # 1000 — разработчик на этой машине; в конвейере раннер ходит под
    # другим uid, и CONTAINER_UID/GID выставляются под него (.github/
    # workflows/ci.yml). Раздать дерево через chown нельзя: часть целей
    # Makefile пишет с хоста, а не из контейнера (api-doc-export,
    # api-types-check — редирект `>` выполняет хостовый shell), и любой
    # выбранный владелец ломал бы вторую половину.
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
      - APP_ENCRYPTION_MASTER_KEY
    volumes:
      - ./api:/var/www/html
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine

  # glibc (bookworm-slim), не alpine — осознанное расхождение с образами
  # PHP, где база alpine. Нативные модули экосистемы Node (rollup, esbuild,
  # lightningcss, oxc, браузеры Playwright) собираются и тестируются прежде
  # всего под glibc; musl — вторичная цель, и за неё уже заплатили дважды.
  # Здесь тот же libc, что у образа playwright ниже. Подробнее —
  # docs/patterns.md, «База образов».
  node-seller:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/seller
    volumes:
      - ./apps:/var/www/apps
      # packages/api-schema — относительные импорты из apps/*/src ведут туда
      # (та же глубина пути, что и на хосте); генерация схемы — тоже отсюда.
      - ./packages:/var/www/packages
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  node-admin:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/admin
    volumes:
      - ./apps:/var/www/apps
      - ./packages:/var/www/packages
    ports:
      - "5174:5174"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]

  # Расширение браузера. Порта нет намеренно: dev-сервера у него быть
  # не может — CSP Manifest V3 запрещает подгрузку кода со стороны,
  # и HMR туда не встроится. Вместо dev-сервера watch-сборка: dist/
  # виден на хосте через тот же bind-mount ./apps, и Chrome грузит
  # его как распакованное расширение (docs/patterns.md, «Расширение
  # браузера»).
  node-extension:
    image: node:24.18.1-bookworm-slim
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/extension
    volumes:
      - ./apps:/var/www/apps
      - ./packages:/var/www/packages
    command: ["npm", "run", "watch"]

  playwright:
    # Playwright's browsers need glibc — Alpine (musl) can't run them at
    # all (not a config issue, upstream doesn't support musl). Browsers
    # ship pre-installed in this image at the exact revision @playwright/test
    # expects — version below is pinned to match package.json at repo root,
    # the only place @playwright/test is declared. The apps don't pin it:
    # their tests/e2e/* spec files resolve `import ... from
    # '@playwright/test'` upward, to the same root node_modules.
    #
    # Whole repo mounted at /var/www, not just ./apps: playwright.config.ts
    # (one config, two projects — seller and admin, docs/structure.md)
    # lives at repo root and its projects' testDir point into both apps'
    # tests/e2e/, so the container needs to see both from one root.
    #
    # working_dir is repo root, not apps/seller: the root package.json's
    # node_modules is what resolves playwright.config.ts's own `import
    # ... from '@playwright/test'` (Node resolution walks up from the
    # requiring file, not sideways into an app's node_modules) and gives
    # `npx playwright` its CLI. Without a local node_modules on the path
    # (cwd defaulting to `/`), npx falls back to fetching a fresh
    # `playwright` package from the registry, and its test-file discovery
    # walks the filesystem from `/`, hitting /etc/credstore (root-only)
    # and failing with EACCES.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
