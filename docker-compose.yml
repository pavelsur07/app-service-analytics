services:
  traefik:
    image: traefik:v3.5
    # ponytail: static file provider, not docker-label discovery — routing
    # is fixed (2 hosts, 1 backend) and this skips a docker.sock mount.
    # Switch to the docker provider when routing needs to react to
    # containers appearing/disappearing (Stage 2+).
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./api:/var/www/html:ro
      - ./apps:/var/www/apps:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      # *.internal aliases so other containers (Playwright) reach the
      # real vhosts by name — *.localhost won't do: glibc/most resolvers
      # hardcode that TLD to loopback per RFC 6761, ignoring Docker's DNS.
      default:
        aliases:
          - app.conwix.internal
          - admin.conwix.internal

  php-fpm:
    build:
      context: ./docker/php
      args:
        PHP_VARIANT: fpm
    volumes:
      - ./api:/var/www/html

  php-cli:
    build:
      context: ./docker/php
      args:
        PHP_VARIANT: cli
    user: "1000:1000"
    environment:
      - HOME=/tmp
    volumes:
      - ./api:/var/www/html
    command: ["tail", "-f", "/dev/null"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine

  # ponytail: glibc (bookworm-slim), not alpine — Node's native addons
  # (rollup, esbuild, lightningcss, oxc, Playwright's browsers) are built
  # and tested against glibc first; musl support is secondary and has
  # already broken twice (Playwright wouldn't run at all, admin's rollup
  # bound to the wrong libc after an install happened outside the
  # container). glibc here also matches `playwright` below and whatever
  # actually builds the production frontend later — one libc, not three.
  node-seller:
    image: node:24.18.1-bookworm-slim
    user: "1000:1000"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/seller
    volumes:
      - ./apps:/var/www/apps
      # packages/api-schema — относительные импорты из apps/*/src ведут туда
      # (та же глубина пути, что и на хосте); генерация схемы — тоже отсюда.
      - ./packages:/var/www/packages
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  node-admin:
    image: node:24.18.1-bookworm-slim
    user: "1000:1000"
    environment:
      - HOME=/tmp
    working_dir: /var/www/apps/admin
    volumes:
      - ./apps:/var/www/apps
      - ./packages:/var/www/packages
    ports:
      - "5174:5174"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]

  playwright:
    # Playwright's browsers need glibc — Alpine (musl) can't run them at
    # all (not a config issue, upstream doesn't support musl). Browsers
    # ship pre-installed in this image at the exact revision @playwright/test
    # expects — version below is pinned to match package.json at repo root,
    # the only place @playwright/test is declared. The apps don't pin it:
    # their tests/e2e/* spec files resolve `import ... from
    # '@playwright/test'` upward, to the same root node_modules.
    #
    # Whole repo mounted at /var/www, not just ./apps: playwright.config.ts
    # (one config, two projects — seller and admin, docs/structure.md)
    # lives at repo root and its projects' testDir point into both apps'
    # tests/e2e/, so the container needs to see both from one root.
    #
    # working_dir is repo root, not apps/seller: the root package.json's
    # node_modules is what resolves playwright.config.ts's own `import
    # ... from '@playwright/test'` (Node resolution walks up from the
    # requiring file, not sideways into an app's node_modules) and gives
    # `npx playwright` its CLI. Without a local node_modules on the path
    # (cwd defaulting to `/`), npx falls back to fetching a fresh
    # `playwright` package from the registry, and its test-file discovery
    # walks the filesystem from `/`, hitting /etc/credstore (root-only)
    # and failing with EACCES.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    user: "1000:1000"
    environment:
      - HOME=/tmp
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: ["tail", "-f", "/dev/null"]

volumes:
  postgres_data:
