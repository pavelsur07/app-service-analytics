# Потолок на приём наблюдений цены (ADR-014). Не бизнес-ограничение,
# а предохранитель против сбойной сборки расширения: наблюдения шлёт код
# на машине клиента, и цикл в нём — единственный способ получить сюда
# тысячи запросов. Порог с большим запасом над легитимной нагрузкой:
# полсотни артикулов по два снимка в час дают сотню, здесь пятьсот.
#
# Ключ — компания, не IP: у продавца может быть несколько устройств
# с расширением, а платит за нагрузку всё равно один арендатор.
#
# Хранилище — Redis (config/packages/cache.yaml, пул cache.rate_limiter,
# он же по умолчанию у framework.rate_limiter). Новой инфраструктуры
# не заводится, CLAUDE.md: «Redis — сессии, rate limit, распределённые
# блокировки — и только».
framework:
    rate_limiter:
        price_observations:
            policy: sliding_window
            limit: 500
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            price_observations:
                # Чтобы тест на срабатывание лимита не слал пятьсот
                # запросов ради одной проверки. Ключ лимитера — компания,
                # а каждый тест заводит свою, поэтому счётчики тестов
                # между собой не пересекаются.
                limit: 5
