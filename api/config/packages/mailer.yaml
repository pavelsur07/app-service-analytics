framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
        # Отправитель — тот самый ящик, которым мы аутентифицируемся
        # у провайдера. Адрес в From не свободное поле: провайдер отклоняет
        # письма с чужого домена, и захардкоженный no-reply@conwix.com
        # означал бы, что ни одно оповещение не уходит вообще.
        #
        # Здесь, а не в коде письма: адрес один на все письма приложения,
        # и следующему письму не придётся его повторять — как и помнить
        # про эту особенность провайдера.
        headers:
            from: '%env(MAILER_FROM)%'
