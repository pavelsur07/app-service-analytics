framework:
    messenger:
        # Куда девается сообщение, исчерпавшее ретраи. Без этой строки —
        # никуда: Symfony удаляет его молча.
        #
        # Проверено дорого. Добор расходов 14 августа 2026 потерял девять
        # дней из десяти, и не сказал об этом ничего: очередь пустая,
        # raw-документа нет, строк расходов нет, подключение active,
        # в логах воркера ноль строк (monolog в проекте не подключён,
        # на stderr не пишется ничего). Тот же день, поставленный
        # повторно, загружался нормально — отказ перемежающийся,
        # на стороне площадки. Единственным следом был трекер, а трекер
        # никто не сверяет с календарём загруженных дней.
        failure_transport: failed

        # Транспорты и их имена заданы ADR-001. Все на doctrine-транспорте:
        # упавшие сообщения видны обычным SQL, отдельного брокера в проде нет.
        #
        # Их два не ради параллелизма, а ради разделимости: у загрузки
        # и у пересчёта разные профили (первая ждёт внешний API под лимитом
        # запросов, второй считает). Пока оба обслуживаются своими воркерами
        # в одном экземпляре; ADR-001 называет условие, при котором счётный
        # слой выносится отдельно всерьёз, — ночной пересчёт дольше двух часов.
        transports:
            async_ingestion:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # Умолчание — три попытки через 1, 2 и 4 секунды, то есть
                # семь секунд на весь отказ. Для площадки, которая отвечает
                # ошибкой минуту-другую, это не три попытки, а одна,
                # повторённая трижды подряд: к моменту последней ничего
                # не успевает измениться.
                #
                # Здесь выдержка настоящая: 30 секунд, полторы минуты,
                # четыре с половиной, дальше по десять — около получаса
                # на переживание сбоя. Верхний предел нужен, иначе
                # множитель уводит последнюю попытку за пределы суток.
                #
                # Это же окно достаётся письмам (routing ниже): SMTP,
                # недоступный семь секунд, до сих пор стоил клиенту
                # уведомления о сломанном подключении.
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 3
                    max_delay: 600000
            # Своё имя очереди обязательно, и это не косметика.
            #
            # DSN без queue_name даёт очередь «default». Пока он стоял
            # у обоих транспортов, они были одной физической очередью
            # в одной таблице, и worker-calc забирал сообщения загрузки,
            # которые ему не предназначены. Разделимость, ради которой
            # транспорта два, существовала только на бумаге.
            #
            # Хуже, чем путаница ролей: выдержку ретрая выбирает тот
            # транспорт, ИЗ которого сообщение получено. Здесь её нет,
            # значит включалось умолчание Symfony — 1, 2, 4 секунды.
            # Кому достанутся какие ретраи, решала гонка двух воркеров:
            # успел worker-ingestion — полчаса на переживание сбоя,
            # успел worker-calc — семь секунд и в отказ.
            #
            # Измерено 16 августа 2026: у строк ретрая в таблице
            # available_at отстоял от created_at на 1–3 секунды вместо
            # тридцати. Из-за этого секундная сетевая заминка убивала
            # загрузку насовсем — по три-пять сообщений в час.
            #
            # async_ingestion намеренно остаётся на «default»: там лежат
            # сообщения в работе, и переименование очереди осиротило бы их.
            async_calc:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: calc
                # Та же выдержка, что у соседа. Сюда пока ничего
                # не маршрутизируется, но умолчание в семь секунд —
                # ловушка, которая уже сработала один раз.
                retry_strategy:
                    max_retries: 5
                    delay: 30000
                    multiplier: 3
                    max_delay: 600000
            sync: 'sync://'

            # Отдельная очередь в той же таблице: смотреть и переотправлять —
            # messenger:failed:show и messenger:failed:retry, разбирать
            # при нужде — обычным SQL, без миграции и без второго хранилища.
            #
            # DSN написан явно, а не через env: если боевой транспорт когда-то
            # переедет на брокер, отказавшие сообщения обязаны остаться
            # в базе. Брокер их переживать не обязан, а смысл этой очереди
            # ровно в том, чтобы пережить.
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        # Правило появляется вместе со своим классом сообщения — заранее
        # заведённая маршрутизация указывала бы на несуществующие классы.
        #
        # Письма — через очередь: отправка перестаёт быть частью сценария,
        # который её вызвал. Уведомление о сломанном подключении (ADR-007)
        # раньше терялось насовсем, если SMTP в этот момент не отвечал:
        # состояние уже переведено в broken, повторная обработка письма
        # не пошлёт, и клиент не узнает — та самая молчаливая остановка
        # синхронизации. Теперь отправка ретраится очередью, а окончательный
        # отказ виден в failed-транспорте и в трекере — до 14 августа 2026
        # эта фраза была неправдой в первой половине: транспорта не было,
        # и «окончательный отказ» означал бесследное удаление.
        #
        # Исключение — сторож свежести данных: он ходит мимо очереди
        # намеренно (services.yaml, mailer.sync). Оповещение о вставшей
        # синхронизации, поставленное в ту же очередь, которая и встала,
        # не доедет ровно тогда, когда нужно.
        routing:
            App\Ingestion\Application\Message\FetchOzonPostingsMessage: async_ingestion
            App\Ingestion\Application\Message\FetchOzonCatalogMessage: async_ingestion
            App\Ingestion\Application\Message\FetchOzonExpensesMessage: async_ingestion
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async_ingestion

# in-memory вместо doctrine-транспорта — тестируем факт и содержимое
# диспатча (SyncOzonAccountCommandTest), не реальную очередь; боевой DSN
# не затрагивается.
when@test:
    framework:
        messenger:
            transports:
                async_ingestion: 'in-memory://'
                # По той же причине, что и выше: сохранение отказавшего
                # сообщения проверяется тем, что транспорт задан
                # (FailedMessagesAreKeptTest), а не тем, что строка легла
                # в тестовую базу. Иначе каждый тест, проверяющий отказ
                # обработчика, оставлял бы за собой мусор в очереди.
                failed: 'in-memory://'
