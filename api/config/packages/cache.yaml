framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Redis только для лимитера входа (ADR-007; CLAUDE.md: "Redis —
        # сессии, rate limit... и только") — cache.app остаётся на
        # файловой системе, отдельный default_redis_provider не заводится
        # ради одного пула, provider объявлен прямо на нём.
        # cache.rate_limiter — имя, которое framework.rate_limiter
        # использует по умолчанию как cache_pool.
        pools:
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'
            # Паузы лимита Seller API (ADR-028): общие для всех воркеров
            # и веб-процесса, поэтому Redis, а не память процесса.
            cache.ozon_seller_limit:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%'

when@test:
    framework:
        cache:
            pools:
                # Пауза лимита не должна переживать тест: в памяти процесса,
                # а не в общем Redis.
                cache.ozon_seller_limit:
                    adapter: cache.adapter.array
                    provider: ~
