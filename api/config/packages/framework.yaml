# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Redis (ADR-007) — отзыв доступа мгновенен: сессия удаляется на
    # сервере, дамп базы не даёт доступа к чужим сессиям. Неделя активной
    # сессии без remember-me; cookie_lifetime и gc_maxlifetime совпадают,
    # иначе данные сессии на сервере истекут раньше самой куки.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        # Имя одно на приложение, и контур администраторов (ADR-017)
        # его разделяет — переименовать под каждый firewall Symfony
        # не даёт. Контуры разводит не имя, а область куки:
        # cookie_domain НЕ ЗАДАН, поэтому кука host-only и живёт
        # отдельно на app.conwix.com и admin.conwix.com.
        #
        # Задать здесь cookie_domain (например, .conwix.com) — значит
        # слить сессии продавца и админки в одну и отменить разделение
        # контуров ADR-007. Не задавать.
        name: conwix_seller_session
        cookie_httponly: true
        cookie_samesite: lax
        cookie_secure: auto
        cookie_lifetime: 604800
        gc_maxlifetime: 604800

    #esi: true
    #fragments: true

    # Именованный клиент на площадку — ретраи/таймауты symfony/http-client
    # штатные, base_uri задаётся один раз здесь, не строкой на каждый вызов.
    # Второй scoped-клиент заводится вместе со вторым коннектором.
    http_client:
        scoped_clients:
            ozon.client:
                base_uri: '%env(OZON_API_BASE_URL)%'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
