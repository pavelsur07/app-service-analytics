security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Свой провайдер (Identity\Infrastructure\Security\UserProvider), не
    # встроенный `entity` — тот обходит UserRepository и обращается
    # к Doctrine напрямую (docs/patterns.md, "Не используем:
    # ServiceEntityRepository и автоподстановка репозитория").
    providers:
        identity_user_provider:
            id: App\Identity\Infrastructure\Security\UserProvider
        # Отдельный провайдер, потому что отдельная таблица (ADR-007).
        # Общий провайдер на два контура означал бы общую таблицу
        # или ветвление по типу внутри него — ADR-007 отверг и то, и то.
        identity_admin_provider:
            id: App\Identity\Infrastructure\Security\AdminProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Перед `api` — первое совпадение побеждает, а ^/api/extension/
        # уже, чем ^/api/. Отдельный firewall, не ветка внутри `api`:
        # тогда сессия не работает на маршрутах расширения, а токен —
        # на маршрутах приложения (ADR-010). Пути не пересекаются,
        # перепутать контуры нечем.
        extension:
            pattern: ^/api/extension/
            # Сессии нет: расширение предъявляет токен на каждом запросе.
            stateless: true
            provider: identity_user_provider
            # Две разные ветки отказа, и нужны обе — иначе 401 приходит
            # HTML-страницей или пустым телом:
            #   заголовка нет вовсе  → AccessTokenAuthenticator::supports()
            #     возвращает false, аутентификатор не запускается, отказ
            #     приходит от access_control → entry_point;
            #   заголовок есть, токен не подошёл → исключение внутри
            #     authenticate() → failure_handler (по умолчанию отдал бы
            #     пустое тело с одним WWW-Authenticate).
            entry_point: App\Identity\Ui\Security\ApiAuthenticationEntryPoint
            # Штатный аутентификатор Symfony, свой не пишется: извлечение
            # заголовка Authorization: Bearer (умолчание token_extractors)
            # и построение Passport фреймворк делает сам. Вся проверка —
            # в token_handler.
            access_token:
                token_handler: App\Identity\Infrastructure\Security\ExtensionTokenHandler
                failure_handler: App\Identity\Ui\Security\ExtensionAuthenticationFailureHandler
            # login_throttling здесь нет намеренно: секрет — 256 бит
            # (ExtensionTokenSecret), перебор не имеет смысла, в отличие
            # от входа по паролю ниже.
        # Перед `api` по той же причине, что и `extension`: первое
        # совпадение побеждает, а ^/api/admin/ уже, чем ^/api/. Стой он
        # ниже — админские маршруты попали бы на firewall продавца,
        # и сессия продавца открывала бы системный контур.
        #
        # Своя сессия отдельного контура держится не именем куки
        # (framework.session.name одно на приложение), а тем, что кука
        # host-only: админка живёт на admin.conwix.com, приложение —
        # на app.conwix.com (ADR-017, раздел про отступление).
        admin:
            pattern: ^/api/admin/
            lazy: true
            provider: identity_admin_provider
            entry_point: App\Identity\Ui\Security\ApiAuthenticationEntryPoint
            json_login:
                check_path: /api/admin/auth/login
                username_path: email
                password_path: password
                success_handler: App\Identity\Ui\Security\AdminLoginSuccessHandler
                # Обработчик отказа общий с контуром продавца намеренно:
                # он ничего не знает о типе пользователя и отвечает
                # одинаково на «нет такого» и «неверный пароль» (ADR-007).
                failure_handler: App\Identity\Ui\Security\LoginFailureHandler
            logout:
                path: /api/admin/auth/logout
                invalidate_session: true
            # Тот же лимит, что у продавца. Администратор видит финансы
            # всех клиентов, и до появления второго фактора (ADR-017,
            # отступление от ADR-007) это единственная защита пароля
            # от перебора.
            login_throttling:
                max_attempts: 5
        api:
            pattern: ^/api/
            lazy: true
            provider: identity_user_provider
            # Без него неаутентифицированный запрос к защищённому пути
            # получает HTML debug-страницу Symfony, не JSON.
            entry_point: App\Identity\Ui\Security\ApiAuthenticationEntryPoint
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: App\Identity\Ui\Security\LoginSuccessHandler
                failure_handler: App\Identity\Ui\Security\LoginFailureHandler
            logout:
                path: /api/auth/logout
                invalidate_session: true
                # Умолчание Symfony (302 на "/") не подходит для JSON API;
                # в 7.4 success_handler убран из схемы firewall.logout —
                # ответ переопределяется подпиской на LogoutEvent
                # (Identity/Ui/EventListener/ApiLogoutResponseListener).
            # По (email, IP) — ADR-007. hide_user_not_found (умолчание
            # true) уже не различает "нет пользователя" и "неверный
            # пароль" на уровне ошибки, здесь то же на уровне лимита:
            # неважно, существует ли email, попытки по нему считаются
            # одинаково. Хранилище лимитера — Redis (cache.yaml,
            # cache.rate_limiter), CLAUDE.md: "Redis — сессии,
            # rate limit... и только".
            login_throttling:
                max_attempts: 5

    # ROLE_SUPER_ADMIN покрывает ROLE_ADMIN (ADR-017): управление
    # аккаунтами клиентов доступно обеим ролям, управление самими
    # администраторами — только верхней. Иерархия описана здесь одна
    # и только здесь; Administrator::getRoles() отдаёт ровно одну роль.
    role_hierarchy:
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    # Первое совпадение побеждает — порядок важен. login/logout публичны
    # (иначе войти невозможно). /api/companies/ требует входа — 401 без
    # сессии; проверку членства (403 для чужой компании) делает
    # CompanyAccessSubscriber дальше, на kernel.controller — access_control
    # не знает про companyId из URL, только про то, что маршрут защищён.
    # Пинг-эндпоинты — публичны как раньше: отсутствие правила
    # не ограничивает.
    access_control:
        - { path: ^/api/auth/sign-up$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/email-verification/resend$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/me, roles: ROLE_USER }
        # Маршруты расширения — тот же ROLE_USER: токен опознаёт того же
        # User (ADR-010), отдельной роли нет, потому что firewall'ы
        # не пересекаются и разделять нечего.
        - { path: ^/api/extension/, roles: ROLE_USER }
        - { path: ^/api/companies/, roles: ROLE_USER }
        # Пинг остаётся публичным: на нём висит smoke-проверка выкладки
        # и стартовый экран админки. Правило нужно явно — в отличие
        # от прежнего состояния, ^/api/admin/ ниже теперь закрыт.
        - { path: ^/api/admin/ping$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin/auth/logout$, roles: PUBLIC_ACCESS }
        # Всё остальное в системном контуре — минимум ROLE_ADMIN.
        # ROLE_SUPER_ADMIN проходит сюда по role_hierarchy; более узкие
        # права ставятся на самих маршрутах через #[IsGranted].
        - { path: ^/api/admin/, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

# То же снижение, что и в test, и по той же причине — но E2E (Playwright)
# идёт не через test-окружение, а через настоящий php-fpm под APP_ENV=dev
# (docker-compose.yml). Полная стоимость 'auto' на CPU CI-раннера
# подводила вход к nginx fastcgi_read_timeout (5s) даже на одном запросе
# без всякой конкуренции — обнаружено красным test-e2e (workers: 1 сам
# по себе не чинил, только снижал вероятность). prod без when@prod —
# полная стоимость сохраняется там, где это дорогая настоящая защита,
# не только цена ожидания в тесте.
when@dev:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
