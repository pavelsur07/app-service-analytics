doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # UuidType — из symfony/doctrine-bridge (транзитивная зависимость
        # doctrine-messenger, теперь используется напрямую и потому явно
        # запрошена в composer.json). Конвертирует symfony/uid Uuid
        # в нативный тип uuid PostgreSQL и обратно (ADR-003: строковое
        # хранение запрещено).
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
        mapping_types:
            uuid: uuid
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        # Не src/Entity — этой папки в проекте нет и не будет
        # (docs/structure.md). Один mapping-блок на модуль, заводится
        # вместе с первой сущностью модуля, не заранее. Ingestion пока
        # без сущностей — блок появится вместе с raw-слоем/sales_fact.
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain'
                prefix: 'App\Identity\Domain'
                alias: Identity

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
