        public: true
        shared: true

    App\Identity\Domain\CaptchaVerifier:
        alias: App\Tests\Support\Fake\FakeCaptchaVerifier

    App\Tests\Support\Probe\PasswordHasherProbe:
        public: true
        shared: true
