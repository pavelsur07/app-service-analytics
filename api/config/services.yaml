# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.version: '%env(APP_VERSION)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $alertEmail: '%env(ALERT_EMAIL)%'
            string $mailerDsn: '%env(MAILER_DSN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Redis — только для сессий и rate limit (ADR-007, CLAUDE.md). ext-redis
    # не установлен (docker/php/Dockerfile), поэтому createConnection()
    # возвращает Predis\Client, не \Redis — класс сервиса указан
    # соответственно.
    redis.connection:
        class: Predis\Client
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'

    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@redis.connection'

    # Отправитель в обход очереди — только для сторожа свежести данных.
    # Обычные письма едут через async_ingestion (messenger.yaml), и это
    # правильно: отправка ретраится, отказ виден. Но оповещение о вставшей
    # синхронизации, поставленное в ту же очередь, которая, возможно,
    # и встала, не доедет ровно в том случае, ради которого написано.
    #
    # Аргументы позиционные: transport, bus, dispatcher. bus = null — это
    # и есть «мимо очереди»; dispatcher нужен, иначе не применится
    # заголовок From из mailer.yaml и любое письмо упадёт на RFC-проверке.
    mailer.sync:
        class: Symfony\Component\Mailer\Mailer
        arguments:
            - '@mailer.transports'
            - null
            - '@event_dispatcher'

    App\Ingestion\Application\NotifyStaleAccountsAction:
        arguments:
            $mailer: '@mailer.sync'
