<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Знак продукта — тот же, что в шапке приложения (Topbar.tsx):
       квадрат со скруглением, фон accent/default, белая «C». Иконка
       вкладки, не совпадающая с логотипом на экране, читается как чужая.

       Цвет продублирован числом намеренно: файл отдаётся браузеру
       как есть, до него не доходят ни Tailwind, ни переменные темы.

       «C» нарисована дугой, а не текстом: <text> зависел бы от шрифтов
       системы, а их у иконки вкладки может не оказаться. -->
  <rect width="32" height="32" rx="7" fill="#1A56DB"/>
  <path d="M21.7 10.3A8 8 0 1 0 21.7 21.7" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
</svg>
