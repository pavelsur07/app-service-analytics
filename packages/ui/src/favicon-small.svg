<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Тот же знак, что в favicon.svg, но под мелкие размеры: штрих
       толще (7 против 4), скругление меньше (5 против 7), просвет
       буквы шире. Из него растеризуются иконки расширения 16 и 32.

       Отдельный вариант, а не уменьшение основного: на 16 пикселях
       штрих в 4 единицы поля превращается в два пикселя и вместе
       со скруглением размазывается антиалиасингом — буква перестаёт
       читаться. Сравнение снималось, разница видна глазом.

       В вебе не используется: там SVG отдаётся браузеру и масштабируется
       сам. Это источник растеризации, и живёт он рядом с основным знаком,
       чтобы правились они вместе. -->
  <rect width="32" height="32" rx="5" fill="#1A56DB"/>
  <path d="M20.9 9A8.5 8.5 0 1 0 20.9 23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
</svg>
