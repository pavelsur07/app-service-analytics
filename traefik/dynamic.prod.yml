# Маршрутизация production. Провайдер файловый, не docker-метки — та же
# причина, что в dev: набор маршрутов фиксирован, а метки потребовали бы
# монтирования docker.sock в контейнер, смотрящий в интернет.
#
# conwix.com здесь отсутствует намеренно. Лендинг живёт в отдельном
# репозитории со своим циклом релизов и своей выкладкой (docs/structure.md);
# этот конвейер и эта топология его не касаются. Маршрут для него здесь
# означал бы, что выкладка приложения способна сломать лендинг.

http:
  routers:
    # HTTP отвечает только редиректом: приложение работает по TLS,
    # а кука сессии по ADR-007 несёт флаг Secure и по http не вернётся.
    app-insecure:
      rule: "Host(`app.conwix.com`)"
      entryPoints: ["web"]
      middlewares: ["to-https"]
      service: nginx

    admin-insecure:
      rule: "Host(`admin.conwix.com`)"
      entryPoints: ["web"]
      middlewares: ["to-https"]
      service: nginx

    links-insecure:
      rule: "Host(`lin.conwix.com`)"
      entryPoints: ["web"]
      middlewares: ["to-https"]
      service: nginx

    app:
      rule: "Host(`app.conwix.com`)"
      entryPoints: ["websecure"]
      service: nginx
      tls:
        certResolver: letsencrypt

    admin:
      rule: "Host(`admin.conwix.com`)"
      entryPoints: ["websecure"]
      # Системный контур закрыт списком адресов (ADR-017): второй фактор
      # отложен вопреки ADR-007, и до его появления это единственное,
      # что стоит между паролем администратора и финансами всех клиентов.
      middlewares: ["admin-allowlist"]
      service: nginx
      tls:
        certResolver: letsencrypt

    links:
      rule: "Host(`lin.conwix.com`)"
      entryPoints: ["websecure"]
      middlewares: ["links-rate-limit"]
      service: nginx
      tls:
        certResolver: letsencrypt

  middlewares:
    to-https:
      redirectScheme:
        scheme: https
        permanent: true

    links-rate-limit:
      rateLimit:
        average: 20
        period: 1s
        burst: 50

    # Вход в админку — только с перечисленных адресов. Список ведётся
    # здесь, а не на сервере:
    # выкладка копирует этот файл (`.github/workflows/ci.yml`), и правка
    # руками в /opt/conwix проживёт до ближайшего деплоя, после чего
    # контур молча откроется всему интернету.
    #
    # Traefik стоит на краю и видит адрес клиента из самого соединения —
    # заголовкам здесь не доверяют и доверять не нужно. В nginx тот же
    # список был бы бесполезен: там $remote_addr — адрес самого Traefik.
    #
    # Middleware только на websecure-роутере. На admin-insecure его нет
    # намеренно: тот лишь редиректит на https, а вешать фильтр
    # на web-entrypoint рискованно рядом с HTTP-01 challenge
    # Let's Encrypt.
    #
    # Проверка выкладки админку не дёргает снаружи — она ходит на nginx
    # с самого сервера, именно чтобы этот список её не ронял.
    admin-allowlist:
      ipAllowList:
        sourceRange:
          # Только корпоративный VPN. Машина разработки была здесь
          # с 2026-08-29 и убрана в тот же день: пока второго фактора
          # нет, этот список — весь периметр админки, и каждый лишний
          # адрес в нём это ещё одна машина, от сохранности которой
          # зависит доступ к финансам всех клиентов.
          - "72.56.81.118/32"
          - "72.56.28.86/32"

  services:
    nginx:
      loadBalancer:
        servers:
          - url: "http://nginx:80"
