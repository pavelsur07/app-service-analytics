name: ci

# Только push, без отдельного триггера pull_request: репозиторий одного
# разработчика, форков нет, и PR всё равно показывает проверку с прогона
# своего head-коммита. Два триггера означали бы два прогона на каждый
# коммит в ветке с открытым PR.
#
# Побочное следствие важнее экономии: у push всегда есть github.event.before,
# поэтому диф считается одинаково на master и на ветке — одна ветка кода
# в фильтрах, а не две.
on: push

# Новый коммит в ту же ветку отменяет предыдущий прогон: досматривать
# результат по устаревшему коду незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Имена собранных образов складываются из имени проекта (conwix-php-cli),
  # и на них ссылаются docker save/load в кэше. Без явного значения имя
  # берётся из названия каталога и молча меняется вместе с ним.
  COMPOSE_PROJECT_NAME: conwix

jobs:
  changes:
    name: фильтры по путям
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        name: что менялось
        run: |
          set -eu
          base='${{ github.event.before }}'

          # Новая ветка, первый коммит или переписанная история: базы для
          # дифа нет. Гоняем всё — «не знаю, что менялось» обязано означать
          # «проверяю всё», а не «пропускаю».
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=''
            reason='базы для дифа нет — полный прогон'
          else
            changed=$(git diff --name-only "$base" '${{ github.sha }}')
            reason="диф $base..${GITHUB_SHA}"
          fi

          matches() { printf '%s\n' "$changed" | grep -qE "$1"; }

          # Затрагивает то, КАК прогоняются проверки, а не только что
          # проверяется: конвейер, окружение, образы, схема БД.
          # Здесь фильтровать нельзя — фильтр судил бы сам о себе.
          everything='^(\.github/|Makefile|docker-compose\.yml|docker/|api/migrations/)'

          if [ -z "$changed" ] || matches "$everything"; then
            backend=true
            frontend=true
          else
            backend=false
            frontend=false
            matches '^api/' && backend=true
            matches '^apps/' && frontend=true
            # Контракт общий: правка схемы касается обеих половин.
            matches '^packages/api-schema/' && { backend=true; frontend=true; }
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

          {
            echo "## Фильтры по путям"
            echo ""
            echo "Основание: $reason"
            echo ""
            echo "| Набор | Запускается |"
            echo "|---|---|"
            echo "| backend (PHP-CS-Fixer, PHPStan, Deptrac, structure-check, PHPUnit) | \`$backend\` |"
            echo "| frontend (typecheck, ESLint, Prettier, Vitest, knip, сборка) | \`$frontend\` |"
            echo "| contract (api-types-check, audit) | \`true\` — всегда |"
            echo "| e2e (Playwright, оба сценария) | \`true\` — всегда |"
            echo ""
            echo "<details><summary>Изменённые файлы</summary>"
            echo ""
            echo '```'
            printf '%s\n' "${changed:-(весь репозиторий)}"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Контейнеры и хост делят чекаут и обязаны сходиться в uid: часть
      # целей Makefile пишет с хоста, а не из контейнера. Подробнее —
      # docker-compose.yml, php-cli.
      - name: uid контейнеров = uid раннера
        run: |
          echo "CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: кэш образа php
        id: php-image
        uses: actions/cache@v4
        with:
          path: /tmp/php-image.tar
          key: php-image-${{ hashFiles('docker/php/Dockerfile') }}

      - name: образ php из кэша или сборкой
        run: |
          set -eu
          if [ '${{ steps.php-image.outputs.cache-hit }}' = 'true' ]; then
            docker load -i /tmp/php-image.tar
          else
            docker compose build php-cli php-fpm
            docker save -o /tmp/php-image.tar conwix-php-cli conwix-php-fpm
          fi

      - name: кэш composer
        id: vendor
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      # Ключ содержит github.sha, поэтому запись происходит каждый прогон,
      # а restore-keys поднимает ближайший предыдущий результат. Иначе
      # кэш PHPStan застыл бы на первом прогоне и с ростом кода
      # переставал бы что-либо ускорять.
      - name: кэш результата PHPStan
        uses: actions/cache@v4
        with:
          path: api/var/phpstan
          key: phpstan-${{ hashFiles('api/composer.lock', 'api/phpstan.neon') }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ hashFiles('api/composer.lock', 'api/phpstan.neon') }}-

      # redis — сессии/rate limit login_throttling (ADR-007). Без него
      # AuthControllerTest::testExceedingLoginAttemptsIsThrottled падает
      # DNS-ошибкой на хосте redis, а не ошибкой самого теста.
      - run: docker compose up -d postgres redis php-cli

      # Без if по cache-hit: composer install не только раскладывает
      # vendor, но и выполняет post-install-cmd (cache:clear,
      # assets:install). Пропустив шаг на попадании, получаем vendor
      # без прогретого var/cache — и php-fpm отвечает 500 на первом же
      # запросе. Кэш обязан экономить скачивание, а не установку.
      - name: composer install
        run: make api-install

      - run: make lint stan deptrac structure-check

      - run: make db-wait db-test-create api-migrate-test test-unit test-int test-func

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Контейнеры и хост делят чекаут и обязаны сходиться в uid: часть
      # целей Makefile пишет с хоста, а не из контейнера. Подробнее —
      # docker-compose.yml, php-cli.
      - name: uid контейнеров = uid раннера
        run: |
          echo "CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      # npm ci стирает node_modules и ставит заново, поэтому кэшируется
      # сам node_modules, а установка при попадании пропускается —
      # кэш только каталога npm ускорял бы install, но не отменял его.
      - name: кэш node_modules (seller)
        id: nm-seller
        uses: actions/cache@v4
        with:
          path: apps/seller/node_modules
          key: npm-seller-${{ hashFiles('apps/seller/package-lock.json') }}

      - name: кэш node_modules (admin)
        id: nm-admin
        uses: actions/cache@v4
        with:
          path: apps/admin/node_modules
          key: npm-admin-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: кэш node_modules (api-schema)
        id: nm-schema
        uses: actions/cache@v4
        with:
          path: packages/api-schema/node_modules
          key: npm-schema-${{ hashFiles('packages/api-schema/package-lock.json') }}

      - name: npm ci
        if: >-
          steps.nm-seller.outputs.cache-hit != 'true' ||
          steps.nm-admin.outputs.cache-hit != 'true' ||
          steps.nm-schema.outputs.cache-hit != 'true'
        run: make front-install-apps

      - run: make front-dev

      - run: make front-typecheck front-lint front-test front-knip front-build

  contract:
    name: контракт и уязвимости
    needs: changes
    # Без if — исключение из фильтров, ради которого фильтры вообще
    # допустимы. Именно правка бэкенда ломает фронтенд; пропустив здесь,
    # экономим минуты, чтобы ловить рассинхронизацию руками.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Контейнеры и хост делят чекаут и обязаны сходиться в uid: часть
      # целей Makefile пишет с хоста, а не из контейнера. Подробнее —
      # docker-compose.yml, php-cli.
      - name: uid контейнеров = uid раннера
        run: |
          echo "CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: кэш образа php
        id: php-image
        uses: actions/cache@v4
        with:
          path: /tmp/php-image.tar
          key: php-image-${{ hashFiles('docker/php/Dockerfile') }}

      - name: образ php из кэша или сборкой
        run: |
          set -eu
          if [ '${{ steps.php-image.outputs.cache-hit }}' = 'true' ]; then
            docker load -i /tmp/php-image.tar
          else
            docker compose build php-cli php-fpm
            docker save -o /tmp/php-image.tar conwix-php-cli conwix-php-fpm
          fi

      - name: кэш composer
        id: vendor
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - name: кэш node_modules (seller)
        id: nm-seller
        uses: actions/cache@v4
        with:
          path: apps/seller/node_modules
          key: npm-seller-${{ hashFiles('apps/seller/package-lock.json') }}

      - name: кэш node_modules (admin)
        id: nm-admin
        uses: actions/cache@v4
        with:
          path: apps/admin/node_modules
          key: npm-admin-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: кэш node_modules (api-schema)
        id: nm-schema
        uses: actions/cache@v4
        with:
          path: packages/api-schema/node_modules
          key: npm-schema-${{ hashFiles('packages/api-schema/package-lock.json') }}

      - run: docker compose up -d postgres php-cli

      # Без if по cache-hit: composer install не только раскладывает
      # vendor, но и выполняет post-install-cmd (cache:clear,
      # assets:install). Пропустив шаг на попадании, получаем vendor
      # без прогретого var/cache — и php-fpm отвечает 500 на первом же
      # запросе. Кэш обязан экономить скачивание, а не установку.
      - name: composer install
        run: make api-install

      - name: npm ci
        if: >-
          steps.nm-seller.outputs.cache-hit != 'true' ||
          steps.nm-admin.outputs.cache-hit != 'true' ||
          steps.nm-schema.outputs.cache-hit != 'true'
        run: make front-install-apps

      - run: make front-dev

      - run: make api-types-check

      - run: make audit

  e2e:
    name: e2e
    needs: changes
    # Тоже без if. Стартовый экран — единственное место, где контракт
    # проверяется целиком: от эндпоинта до отрисовки.
    runs-on: ubuntu-latest
    # Мастер-ключ шифрования учётных данных площадок (ADR-007) для
    # дев-БД, в которую сеет данные test-e2e. Не боевой секрет — ключ
    # только для одноразовых прогонов CI, реальных данных под ним нет.
    # docker-compose.yml пробрасывает переменную в php-cli/php-fpm,
    # только если она задана на хосте.
    env:
      APP_ENCRYPTION_MASTER_KEY: ${{ secrets.APP_ENCRYPTION_MASTER_KEY_CI }}
    steps:
      - uses: actions/checkout@v5

      # Контейнеры и хост делят чекаут и обязаны сходиться в uid: часть
      # целей Makefile пишет с хоста, а не из контейнера. Подробнее —
      # docker-compose.yml, php-cli.
      - name: uid контейнеров = uid раннера
        run: |
          echo "CONTAINER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "CONTAINER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: кэш образа php
        id: php-image
        uses: actions/cache@v4
        with:
          path: /tmp/php-image.tar
          key: php-image-${{ hashFiles('docker/php/Dockerfile') }}

      - name: образ php из кэша или сборкой
        run: |
          set -eu
          if [ '${{ steps.php-image.outputs.cache-hit }}' = 'true' ]; then
            docker load -i /tmp/php-image.tar
          else
            docker compose build php-cli php-fpm
            docker save -o /tmp/php-image.tar conwix-php-cli conwix-php-fpm
          fi

      - name: кэш composer
        id: vendor
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}

      - name: кэш node_modules (seller)
        id: nm-seller
        uses: actions/cache@v4
        with:
          path: apps/seller/node_modules
          key: npm-seller-${{ hashFiles('apps/seller/package-lock.json') }}

      - name: кэш node_modules (admin)
        id: nm-admin
        uses: actions/cache@v4
        with:
          path: apps/admin/node_modules
          key: npm-admin-${{ hashFiles('apps/admin/package-lock.json') }}

      - name: кэш node_modules (api-schema)
        id: nm-schema
        uses: actions/cache@v4
        with:
          path: packages/api-schema/node_modules
          key: npm-schema-${{ hashFiles('packages/api-schema/package-lock.json') }}

      - name: кэш node_modules (e2e, корень)
        id: nm-e2e
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-e2e-${{ hashFiles('package-lock.json') }}

      # redis — сессии (ADR-007, RedisSessionHandler). Без него php-fpm
      # не может достучаться до хоста redis при входе — тот же класс
      # пробела, что уже чинили в backend-джобе (login_throttling),
      # здесь не был перенесён на e2e-джобу.
      - run: docker compose up -d postgres redis php-fpm nginx playwright

      # См. комментарий в задаче backend: шаг обязателен и при попадании
      # в кэш — post-install-cmd прогревает var/cache, без которого
      # php-fpm отдаёт 500.
      - name: composer install
        run: docker compose up -d php-cli && make api-install

      - name: npm ci
        if: >-
          steps.nm-seller.outputs.cache-hit != 'true' ||
          steps.nm-admin.outputs.cache-hit != 'true' ||
          steps.nm-schema.outputs.cache-hit != 'true' ||
          steps.nm-e2e.outputs.cache-hit != 'true'
        run: make front-install

      - run: make front-dev

      - run: make front-build

      # Статика фронтенда — артефакт конвейера, а не стадия образа.
      # Почему так — docs/patterns.md, «Сборка образов»: где её отдавать,
      # ещё не решено, а запекание в образ приложения связало бы правку
      # стиля с пересборкой и перевыкладкой PHP.
      #
      # Выкладывается только с master и берётся отсюда, а не из задачи
      # image: собрана она здесь, и вторая сборка ради артефакта была бы
      # той же работой второй раз. Номер прогона общий с тегом образа,
      # поэтому пара «образ — статика» восстанавливается однозначно.
      - name: статика фронтенда
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.run_number }}
          path: |
            apps/seller/dist/
            apps/admin/dist/
          retention-days: 30

      # test-e2e сеет данные в dev-БД (bin/e2e-seed.sh), а не в тестовую —
      # экран открывается против того же php-fpm, что видит браузер.
      # Без миграции здесь она пуста: раньше это было незаметно, пока
      # e2e не требовал таблиц (стартовый пинг-экран).
      - run: make db-wait api-migrate

      - run: make test-e2e

      - name: отчёт Playwright при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: var/playwright/
          retention-days: 7

  image:
    name: сборка и публикация образа
    needs: [backend, frontend, contract, e2e]
    # always() — пропущенные backend/frontend не должны утаскивать за собой
    # публикацию; !failure() && !cancelled() — упавшие обязаны.
    if: >-
      always() && !failure() && !cancelled()
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        name: тег сборки
        run: |
          set -eu
          tag="${{ github.run_number }}-$(git rev-parse --short HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Тег сборки: \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: вход в ghcr
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Тег попадает внутрь образа как APP_VERSION, откуда его берёт
      # параметр app.version и отдаёт эндпоинт версии. Отдельной версии
      # у фронтенда нет намеренно: он показывает то, что вернул API, —
      # два источника «что развёрнуто» расходились бы молча.
      - name: сборка и публикация
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}/api"
          docker build \
            -f docker/php/Dockerfile \
            --target prod \
            --build-arg APP_VERSION='${{ steps.tag.outputs.tag }}' \
            -t "$image:${{ steps.tag.outputs.tag }}" \
            -t "$image:latest" \
            .
          docker push "$image:${{ steps.tag.outputs.tag }}"
          docker push "$image:latest"

      # Явная проверка того, что --target выбран верно: dev-стадия
      # содержит composer и pcov, prod не должна. Ошибиться здесь легко
      # (опечатка в target собирает последнюю стадию файла), а заметить
      # трудно — образ при этом рабочий.
      - name: в prod-образе нет инструментов разработки
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}/api:${{ steps.tag.outputs.tag }}"
          for tool in composer phpunit phpstan deptrac; do
            if docker run --rm "$image" sh -c "command -v $tool" >/dev/null 2>&1; then
              echo "в prod-образе найден $tool" >&2; exit 1
            fi
          done
          if docker run --rm "$image" php -m | grep -qi pcov; then
            echo "в prod-образе найден pcov" >&2; exit 1
          fi
          echo "composer, phpunit, phpstan, deptrac, pcov отсутствуют"

      # Официальный образ не активирует ни один из своих php.ini, и без
      # явного mv php работает на встроенных умолчаниях: ошибки уходят
      # в HTTP-ответ, аргументы функций — в стектрейсы. Молчаливый режим,
      # который не отличить от рабочего, пока наружу не уедет путь
      # или ключ площадки.
      - name: prod-образ настроен как production
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}/api:${{ steps.tag.outputs.tag }}"
          check() {
            actual=$(docker run --rm "$image" php -r "echo ini_get('$1') ?: 'Off';")
            [ "$actual" = "$2" ] || { echo "$1: ожидалось $2, получено $actual" >&2; exit 1; }
            echo "  $1 = $actual"
          }
          docker run --rm "$image" php -r 'exit(php_ini_loaded_file() ? 0 : 1);' \
            || { echo "php.ini не активирован" >&2; exit 1; }
          check display_errors Off
          check display_startup_errors Off
          check zend.exception_ignore_args 1

      - name: тег виден внутри образа
        run: |
          set -eu
          image="ghcr.io/${{ github.repository }}/api:${{ steps.tag.outputs.tag }}"
          baked=$(docker run --rm "$image" php -r 'echo getenv("APP_VERSION");')
          echo "APP_VERSION в образе: $baked"
          [ "$baked" = '${{ steps.tag.outputs.tag }}' ] \
            || { echo "APP_VERSION в образе не совпал с тегом" >&2; exit 1; }

  deploy:
    name: выкладка
    needs: [image, e2e]
    # always() и явная проверка результатов, а не просто ветка.
    #
    # Пропуск задачи распространяется по всей цепочке needs: фильтр
    # выключил backend — и выкладка пропускалась следом, хотя зависит
    # она от image, а тот отработал. Задача image от этого защищена
    # своим always(), выкладка не была: коммит без изменений в api
    # публиковал образ и не разворачивал его, оставляя прод на прошлой
    # версии при зелёном конвейере.
    if: >-
      always()
      && needs.image.result == 'success'
      && needs.e2e.result == 'success'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Не GitHub Environment с обязательным подтверждением: выкладка
    # автоматическая по решению владельца. Предохранитель остался один
    # и он настоящий — миграции ниже, их конвейер не применяет.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      # Собранная статика приезжает артефактом из задачи e2e: она её уже
      # собрала, вторая сборка была бы той же работой второй раз.
      - name: статика фронтенда
        uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.run_number }}
          path: static-artifact

      - name: ключ доступа
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.DEPLOY_SSH_KEY }}' > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Отпечаток хоста задан секретом, а не accept-new: иначе первая
          # выкладка приняла бы любой сервер, оказавшийся по этому адресу.
          printf '%s\n' '${{ secrets.DEPLOY_KNOWN_HOSTS }}' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: топология и статика на сервер
        run: |
          set -eu
          SSH="ssh -i $HOME/.ssh/deploy -o BatchMode=yes"
          HOST='root@${{ secrets.DEPLOY_HOST }}'
          # Раскладка seller/ и admin/ — как её ждёт docker/nginx/prod.conf.
          rsync -az --delete -e "$SSH" \
            static-artifact/seller/dist/ "$HOST:/opt/conwix/static/seller/"
          rsync -az --delete -e "$SSH" \
            static-artifact/admin/dist/ "$HOST:/opt/conwix/static/admin/"
          # Файлы топологии — из репозитория, чтобы правка compose доезжала
          # вместе с кодом, а не переносилась руками.
          rsync -az -e "$SSH" docker-compose.prod.yml "$HOST:/opt/conwix/"
          rsync -az -e "$SSH" traefik/dynamic.prod.yml "$HOST:/opt/conwix/traefik/"
          rsync -az -e "$SSH" docker/nginx/prod.conf "$HOST:/opt/conwix/docker/nginx/"

      # Миграции конвейер НЕ применяет — CLAUDE.md, «Миграции и изменения
      # схемы»: применение к боевым данным всегда решение человека.
      # Но выложить код, которому нужна ещё не применённая схема, тоже
      # нельзя: приложение упадёт уже у клиента. Поэтому проверка есть,
      # а применения нет — при непринятых миграциях выкладка
      # останавливается до вмешательства.
      #
      # Проверка идёт против НОВОГО образа, ещё не заменившего работающий
      # api — docker compose run создаёт одноразовый контейнер (--no-deps:
      # не трогает уже запущенные postgres/redis), --rm убирает его сразу.
      # Раньше проверка шла через exec в уже работающий api-контейнер —
      # то есть против СТАРОГО кода, который никогда не знает про миграцию,
      # которую только что принесла эта же выкладка. Проверка проходила
      # вхолостую и однажды пропустила реальный случай (2026-08-09,
      # первая выкладка с новой миграцией после ввода этого шага): образ
      # выкатился, схему никто не тронул, /api/auth/* отвечали 500 до
      # ручного вмешательства. -T обязателен — без него docker compose run
      # пытается выделить TTY и виснет в non-interactive SSH-сессии.
      - name: новый образ и проверка миграций
        run: |
          set -eu
          IMAGE='ghcr.io/${{ github.repository }}/api:${{ needs.image.outputs.tag }}'
          # Токен задачи, а не долгоживущий PAT: он действителен только
          # на время прогона, и на сервере не остаётся — logout сразу
          # после pull, до migrations:up-to-date.
          ssh -i "$HOME/.ssh/deploy" -o BatchMode=yes 'root@${{ secrets.DEPLOY_HOST }}' \
            "set -eu
             cd /opt/conwix
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             docker pull '$IMAGE'
             docker logout ghcr.io
             # IMAGE в .env, а не только в команде: иначе ps, logs, restart
             # и сам docker compose run ниже не знают, какой образ брать.
             sed -i '/^IMAGE=/d' .env
             echo 'IMAGE=$IMAGE' >> .env
             docker compose -f docker-compose.prod.yml run --rm --no-deps -T api \
               php bin/console doctrine:migrations:up-to-date" \
            || { echo "Есть непринятые миграции. Примените их вручную и повторите выкладку." >&2; exit 1; }

      - name: выкладка
        run: |
          set -eu
          # Образ уже подтянут и прописан в .env шагом выше — здесь только
          # замена работающих контейнеров на него.
          ssh -i "$HOME/.ssh/deploy" -o BatchMode=yes 'root@${{ secrets.DEPLOY_HOST }}' \
            'cd /opt/conwix && docker compose -f docker-compose.prod.yml up -d'

      # С повторами, а не один запрос после sleep: контейнер поднимается
      # не мгновенно, и одиночная проверка ловила пустой ответ, объявляя
      # исправную выкладку неудачной.
      - name: развёрнут именно этот тег
        run: |
          set -eu
          want='${{ needs.image.outputs.tag }}'
          for host in app.conwix.com admin.conwix.com; do
            case "$host" in app.*) path=/api/seller/ping;; *) path=/api/admin/ping;; esac
            got=''
            for _ in $(seq 1 20); do
              got=$(curl -sf --max-time 10 "https://$host$path" 2>/dev/null \
                    | sed -E 's/.*"version":"([^"]+)".*/\1/') || got=''
              [ "$got" = "$want" ] && break
              sleep 5
            done
            [ "$got" = "$want" ] \
              || { echo "$host отдаёт версию '${got:-(нет ответа)}', ожидалась '$want'" >&2; exit 1; }
            echo "  $host → $got"
          done

      - name: все сервисы здоровы
        run: |
          set -eu
          ssh -i "$HOME/.ssh/deploy" -o BatchMode=yes 'root@${{ secrets.DEPLOY_HOST }}' \
            "cd /opt/conwix
             docker compose -f docker-compose.prod.yml ps --format '{{.Service}} {{.Status}}'
             ! docker compose -f docker-compose.prod.yml ps --format '{{.Status}}' | grep -qE 'unhealthy|Restarting'"
