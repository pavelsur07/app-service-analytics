# Имя api резолвится на каждый запрос, а не один раз при старте.
#
# Без этого nginx запоминает IP контейнера при загрузке конфигурации,
# а выкладка пересоздаёт api и выдаёт ему новый адрес — nginx остаётся
# со старым и отвечает 502, пока его не перезапустят. Ловилось дважды:
# в dev при пересоздании php-fpm и на первой автоматической выкладке.
#
# 127.0.0.11 — встроенный DNS docker; переменная в fastcgi_pass
# обязательна, с литеральным именем nginx резолвит только при старте.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    # app.conwix.internal — same vhost, reachable from other containers.
    # Not *.localhost: glibc/most resolvers hardcode that TLD to loopback
    # per RFC 6761 and ignore Docker's DNS, so containers (Playwright)
    # need a name that isn't shortcut that way.
    server_name app.conwix.localhost app.conwix.internal;
    root /var/www/apps/seller/dist;

    location / {
        try_files $uri /index.html;
    }

    # Системный контур на этом хосте не обслуживается. Оба server-блока
    # проксируют один и тот же php-fpm, поэтому без этого правила
    # https://app.conwix.com/api/admin/... доходил бы до admin-firewall
    # в обход ограничения по адресам, которое стоит на роутере admin
    # в Traefik (ADR-017). Компенсация отсутствующего второго фактора
    # снималась бы сменой имени хоста в адресной строке.
    #
    # ^~ обязателен: без него побеждает менее специфичный /api/ ниже.
    # 404, а не 403: существование контура на чужом хосте — не их дело.
    location ^~ /api/admin/ {
        return 404;
    }

    location /api/ {
        try_files $uri @api;
    }

    location ~ \.php$ {
        return 404;
    }

    location @api {
        root /var/www/html/public;
        set $upstream php-fpm:9000;
        fastcgi_pass $upstream;
        # Падать быстро вместо ~60s по умолчанию: остановленный php-fpm
        # иначе выглядит для браузера зависанием, а не ошибкой.
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
}

server {
    listen 80;
    server_name admin.conwix.localhost admin.conwix.internal;
    root /var/www/apps/admin/dist;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        try_files $uri @api;
    }

    location ~ \.php$ {
        return 404;
    }

    location @api {
        root /var/www/html/public;
        set $upstream php-fpm:9000;
        fastcgi_pass $upstream;
        # Падать быстро вместо ~60s по умолчанию: остановленный php-fpm
        # иначе выглядит для браузера зависанием, а не ошибкой.
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
}
