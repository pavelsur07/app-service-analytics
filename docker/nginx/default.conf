server {
    listen 80;
    server_name app.conwix.localhost;
    root /var/www/apps/seller/dist;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        try_files $uri @api;
    }

    location ~ \.php$ {
        return 404;
    }

    location @api {
        root /var/www/html/public;
        fastcgi_pass php-fpm:9000;
        # ponytail: fail fast instead of nginx's ~60s default — a stopped
        # php-fpm otherwise reads as a hang, not an error, to the browser.
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
}

