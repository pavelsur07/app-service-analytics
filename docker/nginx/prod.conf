# Имя api резолвится на каждый запрос, а не один раз при старте.
#
# Без этого nginx запоминает IP контейнера при загрузке конфигурации,
# а выкладка пересоздаёт api и выдаёт ему новый адрес — nginx остаётся
# со старым и отвечает 502, пока его не перезапустят. Ловилось дважды:
# в dev при пересоздании php-fpm и на первой автоматической выкладке.
#
# 127.0.0.11 — встроенный DNS docker; переменная в fastcgi_pass
# обязательна, с литеральным именем nginx резолвит только при старте.
resolver 127.0.0.11 valid=10s ipv6=off;

# Production-vhost. Отличается от default.conf принципиально: там статика
# и код монтируются из рабочего дерева, здесь статика приезжает томом,
# а PHP живёт внутри образа api и по файловой системе nginx недоступен.
#
# TLS здесь нет намеренно. По ADR-001 у Traefik и nginx разные зоны:
# Traefik терминирует TLS и маршрутизирует по имени хоста, nginx отдаёт
# статику и проксирует в php-fpm. Дублировать TLS на втором уровне ADR-001
# отверг явно.
#
# Два server-блока — это не повтор маршрутизации Traefik, а выбор корня
# статики: у seller и admin разные сборки, и различить их можно только
# по имени хоста.

server {
    listen 80;
    server_name app.conwix.com;
    root /srv/static/seller;

    location / {
        try_files $uri /index.html;
    }

    # Системный контур на этом хосте не обслуживается. Оба server-блока
    # проксируют один и тот же php-fpm, поэтому без этого правила
    # https://app.conwix.com/api/admin/... доходил бы до admin-firewall
    # в обход ограничения по адресам, которое стоит на роутере admin
    # в Traefik (ADR-017). Компенсация отсутствующего второго фактора
    # снималась бы сменой имени хоста в адресной строке.
    #
    # ^~ обязателен: без него побеждает менее специфичный /api/ ниже.
    # 404, а не 403: существование контура на чужом хосте — не их дело.
    location ^~ /api/admin/ {
        return 404;
    }

    location /api/ {
        try_files $uri @api;
    }

    # Файлов PHP в корне статики нет и быть не должно; запрос к ним —
    # признак попытки, а не опечатки.
    location ~ \.php$ {
        return 404;
    }

    location @api {
        # Путь к index.php — как его видит контейнер api, не nginx:
        # сам файл nginx не читает, он передаёт строку в FastCGI.
        root /var/www/html/public;
        set $upstream api:9000;
        fastcgi_pass $upstream;
        # Падать быстро вместо ~60s по умолчанию: остановленный php-fpm
        # иначе выглядит для браузера зависанием, а не ошибкой.
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 30s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Traefik терминирует TLS, до nginx запрос доходит по http.
        # Без этого Symfony сгенерирует ссылки со схемой http и выставит
        # куку сессии без Secure, чего требует ADR-007.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
    }
}

server {
    listen 80;
    server_name admin.conwix.com;
    root /srv/static/admin;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        try_files $uri @api;
    }

    location ~ \.php$ {
        return 404;
    }

    location @api {
        root /var/www/html/public;
        set $upstream api:9000;
        fastcgi_pass $upstream;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 30s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
    }
}

# Публичный vhost намеренно минимален: ни статики, ни admin API,
# только base62-код редиректа. Rate limit остаётся на внешнем Traefik.
server {
    listen 80;
    server_name lin.conwix.com;

    location ~ "^/[0-9A-Za-z]{7}$" {
        try_files /__links_front_controller__ @links_api;
    }

    location / {
        return 404;
    }

    location @links_api {
        root /var/www/html/public;
        set $upstream api:9000;
        fastcgi_pass $upstream;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout 5s;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;
    }
}

# Запрос с неизвестным именем хоста не должен молча попадать в первый
# по порядку server-блок: до выяснения это выглядело бы как работающий
# seller на чужом домене.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
