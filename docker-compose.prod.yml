# Описание production-топологии, не выкладка.
#
# Куда это разворачивается — открытый вопрос (Stage 4, «Не входит»).
# Файл существует, чтобы два решения были записаны исполнимо, а не прозой:
# из какого образа поднимается веб-процесс и воркер, и как воркер получает
# сигнал остановки. Проза расходится с реальностью молча, compose-файл
# проверяется запуском.
#
# Хостов, реквизитов и секретов здесь нет и быть не должно: значения
# приезжают из окружения площадки развёртывания. Файл не наследует
# docker-compose.yml и не предназначен для запуска рядом с ним —
# в нём другая роль у тех же имён.
#
# Запуск (когда появится куда):
#   IMAGE=ghcr.io/…/api:<тег> docker compose -f docker-compose.prod.yml up -d

services:
  # Веб-процесс и воркер — ОДИН образ с разной командой.
  #
  # Два образа означали бы, что код веб-процесса и код воркера могут
  # разъехаться. Ошибки этого класса — «в API работает, в фоне нет» —
  # ищутся часами, потому что оба процесса выглядят исправными,
  # а расхождение видно только в диффе двух реестровых тегов.
  api:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:12-abcdef0}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: ${DATABASE_URL:?}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?}
    # Команда не переопределяется — образ уже запускает php-fpm.
    # Живость проверяет HEALTHCHECK из Dockerfile (ping.path php-fpm).

  worker:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:12-abcdef0}
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: ${DATABASE_URL:?}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:?}
    # init: true подкладывает системный init первым процессом.
    #
    # Без него PID 1 — сам воркер, а PID 1 в Linux не получает действий
    # по умолчанию для сигналов: SIGTERM просто игнорируется, если
    # обработчик не установлен. Docker подождёт таймаут и убьёт процесс
    # SIGKILL — посреди обработки сообщения, без отката и без записи
    # в журнал. Messenger обрабатывает SIGTERM корректно (доделывает
    # текущее сообщение и выходит), но получить сигнал он должен.
    init: true
    # --time-limit: воркер сам выходит раз в час, restart поднимает его
    # заново. Дешёвая защита от накопления памяти в долгоживущем процессе;
    # перезапуск безопасен ровно потому, что обработчики идемпотентны
    # (CLAUDE.md, правило 4).
    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - --time-limit=3600
      - --memory-limit=256M
