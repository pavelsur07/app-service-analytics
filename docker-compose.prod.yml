# Описание production-топологии, не выкладка.
#
# Куда это разворачивается — открытый вопрос (Stage 4, «Не входит»).
# Файл существует, чтобы решения были записаны исполнимо, а не прозой:
# проза расходится с реальностью молча, compose-файл проверяется запуском.
#
# Хостов, реквизитов и секретов здесь нет и быть не должно: всё приезжает
# из окружения площадки развёртывания. Файл не наследует docker-compose.yml
# и рядом с ним не запускается — в нём другая роль у тех же имён.
#
# Топология развёрнута и обслуживает боевой трафик на app.conwix.com
# и admin.conwix.com. Сертификаты Let's Encrypt выпущены, все семь
# сервисов в состоянии healthy. Что именно проверено — docs/structure.md,
# раздел про этот файл.
#
#   IMAGE=ghcr.io/…/api:<тег> APP_SECRET=… ACME_EMAIL=… \
#   POSTGRES_USER=… POSTGRES_PASSWORD=… POSTGRES_DB=… DATABASE_URL=… \
#   APP_ENCRYPTION_MASTER_KEY=… \
#   docker compose -f docker-compose.prod.yml up -d
#
# Потолки памяти (mem_limit) выставлены под машину с 1.9 ГиБ. Это
# предохранитель, а не резервирование: сумма потолков больше физической
# памяти намеренно, каждый контейнер берёт сколько нужно, но ни один
# не может унести остальные.
#
# ДО первого запуска, вручную человеком (CLAUDE.md, «Миграции»):
#   1. Миграции применены к базе.
#   2. Таблица messenger_messages существует. DSN содержит auto_setup=0 —
#      приложение не создаёт её само, и воркеры без неё уходят в цикл
#      перезапуска. Проверено локально: пока таблицы нет, оба воркера
#      падают с «relation messenger_messages does not exist», после
#      создания становятся healthy.
#   3. Каталог ./static рядом с этим файлом наполнен сборкой фронтенда
#      (артефакт прогона frontend-<номер>, раскладка seller/ и admin/).

x-api-env: &api-env
  APP_ENV: prod
  APP_SECRET: ${APP_SECRET:?}
  # PostgreSQL — на этой же машине, сервис postgres ниже.
  #
  # Плата за это решение названа прямо: восстановление на момент времени
  # и проверенные копии (docs/operations-checklist.md, «До первого
  # платящего клиента») управляемая база давала бы из коробки, а здесь
  # их предстоит построить самим, и до тех пор их нет. Не «сделаем
  # потом» вообще, а первый пункт того же чек-листа.
  DATABASE_URL: ${DATABASE_URL:?}
  # Redis, наоборот, внутри: по ADR-001 в нём только сессии, лимиты
  # запросов и блокировки. Потеря содержимого стоит повторного входа,
  # а не данных, — управляемый сервис ради этого не нужен.
  REDIS_URL: redis://redis:6379
  MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
  # Мастер-ключ шифрования credentials площадок (ADR-007). Значение —
  # только в /opt/conwix/.env на сервере, не в git. Его потеря делает
  # все зашифрованные учётные данные площадок невосстановимыми —
  # резервная копия хранится отдельно от сервера.
  APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY:?}
  # GlitchTip (протокол Sentry). :- , не :? — отсутствие DSN не должно
  # ронять деплой, SDK при пустом значении корректно ничего не отправляет
  # (config/packages/sentry.yaml). Добавляется в /opt/conwix/.env отдельным
  # действием, не входит в этот compose-файл.
  SENTRY_DSN: ${SENTRY_DSN:-}
  # Redis, не flock (dev-умолчание из .env, испечённого в образ): лок
  # планировщика (worker-scheduler) должен быть виден из контейнера,
  # который его держит, распределённо — flock живёт в границах одного
  # контейнера и для этого не подходит даже с одним экземпляром сервиса.
  # ADR-001 называет Redis предназначенным именно для распределённых
  # блокировок.
  LOCK_DSN: redis://redis:6379
  # SMTP провайдера и адрес, куда уходит оповещение о несвежих данных.
  # :- , не :? — иначе отсутствие любого из них ронял бы разбор compose
  # целиком, то есть и выкладку api. Отсутствие замечает не парсер,
  # а сам сторож: worker-freshness ниже падает на первом тике с пустым
  # ALERT_EMAIL и уходит в перезапуск, а шаг «все сервисы здоровы»
  # красит выкладку в красный. Молча работать вхолостую он не умеет.
  MAILER_DSN: ${MAILER_DSN:-null://null}
  MAILER_FROM: ${MAILER_FROM:-}
  ALERT_EMAIL: ${ALERT_EMAIL:-}

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    # TLS — Let's Encrypt через HTTP-01, разрешает его сам Traefik.
    # Выбран против DNS-01: последний умеет wildcard, но требует токен
    # DNS-провайдера, то есть ещё один секрет с правом менять зону.
    # Доменов два и они известны заранее — wildcard не нужен.
    # Против ручных сертификатов: продление вручную — операция, о которой
    # вспоминают в день истечения.
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.prod.yml:/etc/traefik/dynamic.yml:ro
      # Том, а не файл на хосте: потеря acme.json означает повторный
      # выпуск сертификатов, а у Let's Encrypt на это недельные лимиты.
      - acme:/acme
    networks: [edge]
    depends_on:
      nginx:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Собранная статика seller и admin. Конвейер отдаёт её артефактом
      # прогона (frontend-<номер>), а не образом: где её отдавать — решение
      # развёртывания, и запекание в образ приложения связало бы правку
      # стиля с перевыкладкой PHP.
      #
      # Каталог, а не именованный том: выкладка тогда — распаковать файлы
      # рядом с compose-файлом, а не запускать вспомогательный контейнер,
      # чтобы наполнить том. Конфиги Traefik и nginx рядом монтируются
      # так же.
      - ./static:/srv/static:ro
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/", "--header", "Host: app.conwix.com"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Веб-процесс и воркеры — ОДИН образ с разной командой.
  #
  # Два образа означали бы, что код веб-процесса и код воркера могут
  # разъехаться. Ошибки этого класса — «в API работает, в фоне нет» —
  # ищутся часами, потому что оба процесса выглядят исправными,
  # а расхождение видно только в диффе двух реестровых тегов.
  api:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:28-abcdef0}
    restart: unless-stopped
    environment: *api-env
    networks: [internal, egress]
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Команда не переопределяется — образ уже запускает php-fpm.
    #
    # Проверка живости берётся из HEALTHCHECK образа и спрашивает только
    # php-fpm (ping.path). CLAUDE.md требует, чтобы проверка затрагивала
    # зависимости — базу, Redis, глубину очереди. Здесь этого нет
    # не по решению, а потому что эндпоинта, который их опрашивает,
    # в приложении не существует: есть только /api/*/ping, не трогающий
    # ничего. Пункт стоит в operations-checklist.md как обязательный
    # до первого платящего клиента; до тех пор проверка честно называется
    # проверкой процесса, а не зависимостей.

  # Воркеров два, по одному на транспорт из ADR-001.
  #
  # Один воркер на оба транспорта был бы дешевле, но загрузка ждёт внешний
  # API под лимитом запросов, а пересчёт считает: длинный опрос площадки
  # задерживал бы пересчёт для всех. Разделение здесь — единственная мера
  # изоляции арендаторов, которую топология вообще может дать.
  #
  # Настоящей изоляции между компаниями НЕТ, и это отложено осознанно.
  # Транспорт doctrine отдаёт сообщения в порядке поступления: компания,
  # поставившая в очередь десять тысяч сообщений, задержит остальные.
  # Лечится это не топологией, а на уровне приложения — нарезкой задания
  # на порции и планировщиком, обходящим компании по кругу. Кода
  # ingestion пока нет, поэтому и планировать нечего; условие возврата
  # к вопросу — первая компания, чья загрузка занимает больше часа.
  worker-ingestion:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:28-abcdef0}
    restart: unless-stopped
    environment: *api-env
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # init: true подкладывает системный init первым процессом.
    #
    # Без него PID 1 — сам воркер, а PID 1 в Linux не получает действий
    # по умолчанию для сигналов: SIGTERM просто игнорируется, если
    # обработчик не установлен. Docker подождёт таймаут и убьёт процесс
    # SIGKILL — посреди обработки сообщения, без отката и без записи
    # в журнал. Messenger обрабатывает SIGTERM корректно (доделывает
    # текущее сообщение и выходит), но получить сигнал он должен.
    init: true
    mem_limit: 256m
    # Ingestion ходит во внешние API: 10 секунд по умолчанию не хватит
    # доделать запрос к площадке, и остановка снова придётся на середину.
    stop_grace_period: 60s
    command:
      - php
      - bin/console
      - messenger:consume
      - async_ingestion
      # Выход раз в час, restart поднимает заново: дешёвая защита
      # от накопления памяти в долгоживущем процессе. Перезапуск безопасен
      # ровно потому, что обработчики идемпотентны (CLAUDE.md, правило 4).
      - --time-limit=3600
      - --memory-limit=112M
    healthcheck:
      # Живость процесса ничего не значит для воркера: он выглядит живым
      # и когда потерял базу. Проверяется зависимость, без которой
      # работа невозможна, — доступность PostgreSQL, она же хранилище
      # самой очереди.
      test: ["CMD", "php", "bin/console", "dbal:run-sql", "SELECT 1", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker-calc:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:28-abcdef0}
    restart: unless-stopped
    environment: *api-env
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    mem_limit: 256m
    # Пересчёт — внутренняя работа без внешних вызовов, поэтому запас
    # меньше, чем у ingestion.
    stop_grace_period: 30s
    command:
      - php
      - bin/console
      - messenger:consume
      - async_calc
      - --time-limit=3600
      - --memory-limit=112M
    healthcheck:
      test: ["CMD", "php", "bin/console", "dbal:run-sql", "SELECT 1", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Триггер расписания — не третий "воркер": не потребляет транспорт,
  # а сам раз в интервал ставит в очередь async_ingestion сообщения
  # для всех активных Ozon-подключений (docs/patterns.md — свой цикл,
  # не symfony/scheduler и не cron на хосте). networks: [internal] без
  # egress — сам в Ozon не ходит, только диспатчит; в Ozon идёт
  # worker-ingestion, когда разберёт сообщение.
  worker-scheduler:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:28-abcdef0}
    restart: unless-stopped
    environment: *api-env
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 128m
    command:
      - php
      - bin/console
      - app:ingestion:schedule-ozon-sync
      - --interval=1800
    healthcheck:
      test: ["CMD", "php", "bin/console", "dbal:run-sql", "SELECT 1", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Сторож свежести данных. Отдельный процесс, а не вторая обязанность
  # worker-scheduler: сторож внутри сторожимого процесса умирает вместе
  # с ним, и тогда «писем нет» означает и «синхронизации нет», и «всё
  # хорошо» одновременно (CheckDataFreshnessCommand). egress — письмо
  # уходит наружу через SMTP провайдера; сеть internal исходящий трафик
  # не выпускает вообще.
  worker-freshness:
    image: ${IMAGE:?нужен тег образа, например ghcr.io/…/api:28-abcdef0}
    restart: unless-stopped
    environment: *api-env
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 128m
    command:
      - php
      - bin/console
      - app:ingestion:check-data-freshness
      - --interval=3600
    # disable: true, а не отсутствие ключа. Просто убрать healthcheck нельзя:
    # тогда наследуется проверка из образа (docker/php/Dockerfile — cgi-fcgi
    # к php-fpm на 9000), а в контейнере с консольной командой fpm нет,
    # и контейнер вечно unhealthy. Именно поэтому соседние воркеры
    # переопределяют её на dbal:run-sql.
    #
    # Свой SELECT 1 сюда не поставлен сознательно: он проверяет базу,
    # а не сторожа, и контейнер с мёртвым основным процессом такую проверку
    # прошёл бы. Для процесса, вся ценность которого в том, что он жив,
    # ложное «здоров» хуже отсутствия проверки. Признак отказа здесь —
    # сам факт перезапуска: ps показывает Restarting, и шаг выкладки
    # «все сервисы здоровы» это ловит.
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal]
    # Порт наружу не публикуется: база доступна только из internal-сети.
    # Опубликованный 5432 на машине с публичным адресом — приглашение
    # к перебору пароля.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    # Вытеснять по достижении лимита, а не падать: содержимое — сессии
    # и счётчики лимитов, потеря старейших дешевле отказа.
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    # Только сессии, лимиты запросов и блокировки (ADR-001). Сохранность
    # между перезапусками не нужна: содержимое восстанавливается повторным
    # входом, а не резервной копией. Том всё же есть — чтобы плановый
    # перезапуск не выкидывал всех пользователей разом.
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# Три сети, а не одна общая: Traefik смотрит в интернет и не должен иметь
# сетевого пути к Redis и к воркерам. nginx — единственный сервис
# в edge и internal одновременно, он и есть граница.
#
# egress — отдельно от internal: internal: true убирает маршрут наружу
# целиком, не только входящий, а api и worker-ingestion должны дозваниваться
# до Ozon (и позже — S3/SMTP/GlitchTip). Не снимаю internal: true с общей
# сети целиком — тогда исходящий интернет получили бы заодно postgres
# и redis, которым он не нужен никогда. egress не публикует ports: ни
# у одного сервиса — входящей поверхности снаружи не добавляет.
networks:
  edge:
  internal:
    internal: true
  egress:

volumes:
  acme:
  postgres_data:
  redis_data:
